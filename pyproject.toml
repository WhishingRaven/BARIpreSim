[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "baripresim"
version = "0.1.0"
description = "Five-robot IR-only recurrent control research simulator"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.2", "matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest>=8"]
hardware = ["reportlab>=4", "pypdf>=5"]

[project.scripts]
bari = "bari.cli:main"

[tool.setuptools.packages.find]
include = ["bari*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
